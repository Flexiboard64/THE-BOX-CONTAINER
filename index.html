<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8">
    <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
    
    <title>The BOX</title> <!-- Supabase JavaScript library --> <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script> <style>
    * {
      box-sizing: border-box;
    }
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: rgb(255, 80, 80);
      color: rgb(255, 91, 91);
    }
    body {
      overflow: hidden;
    }
    /* ==============================
       USERNAME SCREEN
    ============================== */
    #usernameScreen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        radial-gradient(
          circle at center,
          #ff4a4a 0%,
          #ff5a5a 55%,
          rgb(255, 87, 87) 100%
        );
      z-index: 100;
    }
    .setup {
      width: 100%;
      max-width: 430px;
      text-align: center;
    }
    .logo {
      font-size: 65px;
      margin-bottom: 10px;
    }
    .setup h1 {
      margin: 0;
      font-size: 42px;
      letter-spacing: -2px;
    }
    .setup p {
      color: #888;
      font-size: 15px;
      margin: 12px 0 30px;
    }
    #usernameInput {
      width: 100%;
      padding: 17px;
      border: 1px solid #ff7575;
      border-radius: 14px;
      background: #ff8383;
      color: rgb(0, 0, 0);
      font-size: 17px;
      outline: none;
    }
    #usernameInput:focus {
      border-color: #ff6f6f;
    }
    #enterButton {
      width: 100%;
      margin-top: 12px;
      padding: 16px;
      border: none;
      border-radius: 14px;
      background: white;
      color: rgb(255, 0, 0);
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    #enterButton:hover {
      background: #ddd;
    }
    /* ==============================
       MAIN APP
    ============================== */
    #app {
      display: none;
      width: 100%;
      height: 100vh;
      flex-direction: column;
    }
    /* ==============================
       HEADER
    ============================== */
    header {
      height: 70px;
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      background: #ef5c5c;
      border-bottom: 1px solid #ff5e5e;
    }
    .headerTitle {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .headerIcon {
      font-size: 25px;
    }
    header h1 {
      margin: 0;
      font-size: 20px;
      letter-spacing: -0.5px;
    }
    #currentUser {
      color: #aaa;
      font-size: 14px;
    }
    /* ==============================
       MESSAGES
    ============================== */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 25px 18px;
      scroll-behavior: smooth;
    }
    .message {
      width: 100%;
      max-width: 720px;
      margin: 0 auto 13px;
      padding: 16px;
      background: #d25b5b;
      border: 1px solid #292929;
      border-radius: 15px;
      animation: messageIn 0.2s ease;
    }
    @keyframes messageIn {
      from {
        opacity: 0;
        transform: translateY(5px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .messageTop {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 9px;
    }
    .username {
      color: white;
      font-weight: bold;
      font-size: 15px;
    }
    .time {
      color: #666;
      font-size: 12px;
    }
    .messageText {
      color: #000000;
      font-size: 15px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    /* ==============================
       VIDEO
    ============================== */
    .messageVideo {
      display: block;
      width: 100%;
      max-width: 500px;
      max-height: 600px;
      margin-top: 12px;
      border-radius: 12px;
      background: #000;
      object-fit: contain;
    }
    /* ==============================
       DELETE
    ============================== */
    .deleteButton {
      margin-top: 12px;
      padding: 7px 11px;
      border: 1px solid #333;
      border-radius: 9px;
      background: #242424;
      color: #999;
      font-size: 12px;
      cursor: pointer;
    }
    .deleteButton:hover {
      background: #333;
      color: white;
    }
    /* ==============================
       EMPTY STATE
    ============================== */
    .empty {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555;
      text-align: center;
    }
    .emptyIcon {
      font-size: 55px;
      margin-bottom: 12px;
    }
    .emptyTitle {
      color: #777;
      font-size: 17px;
    }
    .emptyText {
      margin-top: 5px;
      color: #4f4f4f;
      font-size: 14px;
    }
    /* ==============================
       COMPOSER
    ============================== */
    #composer {
      width: 100%;
      padding: 13px 18px;
      background: #151515;
      border-top: 1px solid #292929;
    }
    .composerInner {
      width: 100%;
      max-width: 720px;
      display: flex;
      gap: 9px;
      margin: auto;
    }
    #messageInput {
      flex: 1;
      min-width: 0;
      padding: 15px;
      border: 1px solid #333;
      border-radius: 13px;
      background: #202020;
      color: white;
      font-size: 15px;
      outline: none;
    }
    #messageInput:focus {
      border-color: #666;
    }
    /* ==============================
       VIDEO BUTTON
    ============================== */
    #videoButton {
      width: 55px;
      min-width: 55px;
      border: 1px solid #333;
      border-radius: 13px;
      background: #202020;
      color: white;
      font-size: 21px;
      cursor: pointer;
    }
    #videoButton:hover {
      background: #2c2c2c;
    }
    #videoButton:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    /* ==============================
       POST BUTTON
    ============================== */
    #postButton {
      width: 82px;
      border: none;
      border-radius: 13px;
      background: rgb(255, 103, 103);
      color: black;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    #postButton:hover {
      background: #ddd;
    }
    #postButton:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    /* ==============================
       VIDEO PREVIEW
    ============================== */
    #videoPreviewContainer {
      width: 100%;
      max-width: 720px;
      margin: 0 auto 10px;
      display: none;
      position: relative;
    }
    #videoPreview {
      display: block;
      width: 180px;
      max-width: 100%;
      max-height: 220px;
      border-radius: 12px;
      background: #000;
    }
    #removeVideoButton {
      position: absolute;
      top: 7px;
      left: 145px;
      width: 30px;
      height: 30px;
      border: none;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      font-size: 17px;
      cursor: pointer;
    }
    #videoInfo {
      margin-top: 6px;
      color: #888;
      font-size: 12px;
    }
    /* ==============================
       MOBILE
    ============================== */
    @media (max-width: 600px) {
      header {
        height: 62px;
        min-height: 62px;
        padding: 0 15px;
      }
      header h1 {
        font-size: 17px;
      }
      .headerIcon {
        font-size: 21px;
      }
      #currentUser {
        font-size: 13px;
      }
      #messages {
        padding: 15px 10px;
      }
      .message {
        padding: 14px;
      }
      #composer {
        padding: 9px;
      }
      #messageInput {
        padding: 14px;
      }
      #videoButton {
        width: 52px;
        min-width: 52px;
      }
      #postButton {
        width: 68px;
      }
      .setup h1 {
        font-size: 35px;
      }
      .logo {
        font-size: 52px;
      }
      #videoPreview {
        width: 150px;
      }
      #removeVideoButton {
        left: 115px;
      }
    }
    </style> </head> <body> <!-- ============================== USERNAME SCREEN ============================== --> <section id="usernameScreen">
    <div class="setup">
      <div class="logo">
        
      </div>
      <h1>
        THE BOX
      </h1>
      <p>
        One place for everyone.<br>
        The fastest way to share messages and videos with friends and the world.
      </p>
      <input
        id="usernameInput"
        type="text"
        maxlength="30"
        placeholder="#yourname"
        autocomplete="off"
      >
      <button
        id="enterButton"
        onclick="enterContainer()"
      >
        Enter THE BOX
      </button>
    </div>
    </section> <!-- ============================== MAIN APPLICATION ============================== --> <section id="app">
    <header>
      <div class="headerTitle">
        <span class="headerIcon">
          
        </span>
        <h1>
          
        </h1>
      </div>
      <div id="currentUser"></div>
    </header>
    <!-- Messages -->
    <main id="messages"></main>
    <!-- Composer -->
    <div id="composer">
      <!-- Video preview -->
      <div id="videoPreviewContainer">
        <video
          id="videoPreview"
          controls
          playsinline
        ></video>
        <button
          id="removeVideoButton"
          onclick="removeSelectedVideo()"
        >
          ×
        </button>
        <div id="videoInfo"></div>
      </div>
      <div class="composerInner">
        <input
          id="messageInput"
          type="text"
          maxlength="2000"
          placeholder="Write something..."
          autocomplete="off"
        >
        <!-- Hidden video selector -->
        <input
          id="videoInput"
          type="file"
          accept="video/*"
          hidden
        >
        <button
          id="videoButton"
          type="button"
          onclick="selectVideo()"
          title="Add a video"
        >
          +
        </button>
        <button
          id="postButton"
          onclick="postMessage()"
        >
          Post
        </button>
      </div>
    </div>
    </section> <script>
    // =====================================================
    // SUPABASE
    // =====================================================
    const SUPABASE_URL =
      "https://rpyzymjyaluahvyzxioi.supabase.co";
    const SUPABASE_KEY =
      "sb_publishable_p2Kq58JsDOmsaz_OZ6iCEw_q5IJJCEY";
    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );
    // =====================================================
    // USER
    // =====================================================
    let username = "";
    let browserId =
      localStorage.getItem(
        "containerBrowserId"
      );
    if (!browserId) {
      browserId =
        crypto.randomUUID();
      localStorage.setItem(
        "containerBrowserId",
        browserId
      );
    }
    // =====================================================
    // RESTORE USERNAME
    // =====================================================
    const savedUsername =
      localStorage.getItem(
        "containerUsername"
      );
    if (savedUsername) {
      username =
        savedUsername;
      showApp();
    }
    // =====================================================
    // ENTER
    // =====================================================
    function enterContainer() {
      let value =
        document
          .getElementById(
            "usernameInput"
          )
          .value
          .trim();
      if (!value) {
        alert(
          "Please create a username."
        );
        return;
      }
      // Automatically add #
      if (!value.startsWith("#")) {
        value =
          "#" + value;
      }
      // Remove spaces
      value =
        value.replace(/\s+/g, "");
      // Validate username
      if (
        !/^#[a-zA-Z0-9_]+$/.test(value)
      ) {
        alert(
          "Username can only contain letters, numbers and underscores."
        );
        return;
      }
      username =
        value;
      localStorage.setItem(
        "containerUsername",
        username
      );
      showApp();
    }
    // =====================================================
    // SHOW APP
    // =====================================================
    function showApp() {
      document
        .getElementById(
          "usernameScreen"
        )
        .style.display =
        "none";
      document
        .getElementById("app")
        .style.display =
        "flex";
      document
        .getElementById(
          "currentUser"
        )
        .textContent =
        username;
      loadMessages();
      subscribeToMessages();
      setTimeout(
        function() {
          document
            .getElementById(
              "messageInput"
            )
            .focus();
        },
        100
      );
    }
    // =====================================================
    // LOAD MESSAGES
    // =====================================================
    async function loadMessages() {
      const result =
        await supabaseClient
          .from("messages")
          .select("*")
          .order(
            "created_at",
            {
              ascending: true
            }
          );
      if (result.error) {
        console.error(
          "Load error:",
          result.error
        );
        showError(
          "Could not load messages."
        );
        return;
      }
      renderMessages(
        result.data
      );
    }
    // =====================================================
    // SELECT VIDEO
    // =====================================================
    function selectVideo() {
      document
        .getElementById(
          "videoInput"
        )
        .click();
    }
    // =====================================================
    // VIDEO SELECTION
    // =====================================================
    document
      .getElementById(
        "videoInput"
      )
      .addEventListener(
        "change",
        function(event) {
          const file =
            event.target.files[0];
          if (!file) {
            return;
          }
          // Check file type
          if (
            !file.type.startsWith("video/")
          ) {
            alert(
              "Please select a video."
            );
            event.target.value = "";
            return;
          }
          // Check file size
          // 50 MB maximum
          const maxSize =
            50 * 1024 * 1024;
          if (file.size > maxSize) {
            alert(
              "Video must be smaller than 50 MB."
            );
            event.target.value = "";
            return;
          }
          // Create temporary video
          // to check duration
          const video =
            document.createElement(
              "video"
            );
          video.preload =
            "metadata";
          video.onloadedmetadata =
            function() {
              URL.revokeObjectURL(
                video.src
              );
              // 15 second limit
              if (
                video.duration > 15
              ) {
                alert(
                  "Videos must be 15 seconds or shorter to be uploaded."
                );
                event.target.value = "";
                return;
              }
              if (
                video.duration <= 0
              ) {
                alert(
                  "Could not read the video."
                );
                event.target.value = "";
                return;
              }
              // Show preview
              const preview =
                document.getElementById(
                  "videoPreview"
                );
              const previewContainer =
                document.getElementById(
                  "videoPreviewContainer"
                );
              const info =
                document.getElementById(
                  "videoInfo"
                );
              preview.src =
                URL.createObjectURL(file);
              info.textContent =
                `${video.duration.toFixed(1)} seconds • ${(file.size / 1024 / 1024).toFixed(1)} MB`;
              previewContainer.style.display =
                "block";
            };
          video.onerror =
            function() {
              alert(
                "Could not read this video."
              );
              event.target.value = "";
            };
          video.src =
            URL.createObjectURL(file);
        }
      );
    // =====================================================
    // REMOVE SELECTED VIDEO
    // =====================================================
    function removeSelectedVideo() {
      const input =
        document.getElementById(
          "videoInput"
        );
      const preview =
        document.getElementById(
          "videoPreview"
        );
      const container =
        document.getElementById(
          "videoPreviewContainer"
        );
      input.value = "";
      if (preview.src) {
        URL.revokeObjectURL(
          preview.src
        );
      }
      preview.removeAttribute(
        "src"
      );
      preview.load();
      container.style.display =
        "none";
    }
    // =====================================================
    // POST MESSAGE
    // =====================================================
    async function postMessage() {
      const input =
        document.getElementById(
          "messageInput"
        );
      const videoInput =
        document.getElementById(
          "videoInput"
        );
      const button =
        document.getElementById(
          "postButton"
        );
      const videoButton =
        document.getElementById(
          "videoButton"
        );
      const text =
        input.value.trim();
      const videoFile =
        videoInput.files[0];
      // Don't post empty message
      if (!text && !videoFile) {
        return;
      }
      button.disabled =
        true;
      videoButton.disabled =
        true;
      let videoUrl =
        null;
      try {
        // ================================================
        // UPLOAD VIDEO
        // ================================================
        if (videoFile) {
          // Create a unique filename
          const extension =
            videoFile.name
              .split(".")
              .pop()
              .toLowerCase();
          const filePath =
            `${browserId}/${crypto.randomUUID()}.${extension}`;
          const upload =
            await supabaseClient
              .storage
              .from("videos")
              .upload(
                filePath,
                videoFile,
                {
                  contentType:
                    videoFile.type,
                  upsert:
                    false
                }
              );
          if (upload.error) {
            throw upload.error;
          }
          // Get public URL
          const publicUrl =
            supabaseClient
              .storage
              .from("videos")
              .getPublicUrl(
                filePath
              );
          videoUrl =
            publicUrl
              .data
              .publicUrl;
        }
        // ================================================
        // INSERT MESSAGE
        // ================================================
        const result =
          await supabaseClient
            .from("messages")
            .insert({
              username:
                username,
              browser_id:
                browserId,
              text:
                text,
              video_url:
                videoUrl
            });
        if (result.error) {
          // If database insert fails
          // try to remove uploaded video
          if (videoUrl && videoFile) {
            // Nothing else required here.
            // Storage cleanup can be added
            // later if desired.
          }
          throw result.error;
        }
        // ================================================
        // RESET COMPOSER
        // ================================================
        input.value = "";
        removeSelectedVideo();
        input.focus();
      } catch (error) {
        console.error(
          "Post error:",
          error
        );
        alert(
          "Could not post the message. Please try again."
        );
      } finally {
        button.disabled =
          false;
        videoButton.disabled =
          false;
      }
    }
    // =====================================================
    // REALTIME
    // =====================================================
    function subscribeToMessages() {
      supabaseClient
        .channel(
          "container-messages"
        )
        .on(
          "postgres_changes",
          {
            event: "*",
            schema: "public",
            table: "messages"
          },
          function(payload) {
            console.log(
              "Realtime update:",
              payload
            );
            loadMessages();
          }
        )
        .subscribe(
          function(status) {
            console.log(
              "Realtime:",
              status
            );
          }
        );
    }
    // =====================================================
    // DELETE MESSAGE
    // =====================================================
    async function deleteMessage(
      id,
      videoUrl
    ) {
      const confirmed =
        confirm(
          "Delete this message?"
        );
      if (!confirmed) {
        return;
      }
      const result =
        await supabaseClient
          .from("messages")
          .delete()
          .eq(
            "id",
            id
          )
          .eq(
            "browser_id",
            browserId
          );
      if (result.error) {
        console.error(
          "Delete error:",
          result.error
        );
        alert(
          "Could not delete the message."
        );
        return;
      }
      // Try to delete associated video
      if (videoUrl) {
        try {
          const marker =
            "/storage/v1/object/public/videos/";
          const index =
            videoUrl.indexOf(
              marker
            );
          if (index !== -1) {
            const filePath =
              decodeURIComponent(
                videoUrl.substring(
                  index + marker.length
                )
              );
            await supabaseClient
              .storage
              .from("videos")
              .remove([
                filePath
              ]);
          }
        } catch (error) {
          console.error(
            "Video cleanup error:",
            error
          );
        }
      }
      loadMessages();
    }
    // =====================================================
    // RENDER
    // =====================================================
    function renderMessages(
      messages
    ) {
      const container =
        document.getElementById(
          "messages"
        );
      container.innerHTML =
        "";
      if (
        !messages ||
        messages.length === 0
      ) {
        container.innerHTML = `
          <div class="empty">
            <div>
              <div class="emptyIcon">
                📦
              </div>
              <div class="emptyTitle">
                The container is empty.
              </div>
              <div class="emptyText">
                Be the first to post something.
              </div>
            </div>
          </div>
        `;
        return;
      }
      messages.forEach(
        function(message) {
          const element =
            document.createElement(
              "div"
            );
          element.className =
            "message";
          // ==============================================
          // HEADER
          // ==============================================
          const messageTop =
            document.createElement(
              "div"
            );
          messageTop.className =
            "messageTop";
          const usernameElement =
            document.createElement(
              "span"
            );
          usernameElement.className =
            "username";
          usernameElement.textContent =
            message.username;
          const timeElement =
            document.createElement(
              "span"
            );
          timeElement.className =
            "time";
          const date =
            new Date(
              message.created_at
            );
          timeElement.textContent =
            date.toLocaleTimeString(
              [],
              {
                hour:
                  "2-digit",
                minute:
                  "2-digit"
              }
            );
          messageTop.appendChild(
            usernameElement
          );
          messageTop.appendChild(
            timeElement
          );
          element.appendChild(
            messageTop
          );
          // ==============================================
          // TEXT
          // ==============================================
          if (
            message.text
          ) {
            const textElement =
              document.createElement(
                "div"
              );
            textElement.className =
              "messageText";
            textElement.textContent =
              message.text;
            element.appendChild(
              textElement
            );
          }
          // ==============================================
          // VIDEO
          // ==============================================
          if (
            message.video_url
          ) {
            const video =
              document.createElement(
                "video"
              );
            video.className =
              "messageVideo";
            video.src =
              message.video_url;
            video.controls =
              true;
            video.playsInline =
              true;
            video.preload =
              "metadata";
            element.appendChild(
              video
            );
          }
          // ==============================================
          // DELETE BUTTON
          // ==============================================
          if (
            message.browser_id ===
            browserId
          ) {
            const deleteButton =
              document.createElement(
                "button"
              );
            deleteButton.className =
              "deleteButton";
            deleteButton.textContent =
              "Delete";
            deleteButton.onclick =
              function() {
                deleteMessage(
                  message.id,
                  message.video_url
                );
              };
            element.appendChild(
              deleteButton
            );
          }
          container.appendChild(
            element
          );
        }
      );
      // Scroll to newest
      container.scrollTop =
        container.scrollHeight;
    }
    // =====================================================
    // HTML ESCAPING
    // =====================================================
    function escapeHTML(
      text
    ) {
      const div =
        document.createElement(
          "div"
        );
      div.textContent =
        text;
      return div.innerHTML;
    }
    // =====================================================
    // ERROR
    // =====================================================
    function showError(
      message
    ) {
      const container =
        document.getElementById(
          "messages"
        );
      container.innerHTML = `
        <div class="empty">
          <div>
            <div style="
              font-size: 45px;
              margin-bottom: 15px;
            ">
              ⚠️
            </div>
            <div style="
              color: #aaa;
            ">
              ${escapeHTML(message)}
            </div>
          </div>
        </div>
      `;
    }
    // =====================================================
    // ENTER KEY - MESSAGE
    // =====================================================
    document
      .getElementById(
        "messageInput"
      )
      .addEventListener(
        "keydown",
        function(event) {
          if (
            event.key ===
            "Enter"
          ) {
            event.preventDefault();
            postMessage();
          }
        }
      );
    // =====================================================
    // ENTER KEY - USERNAME
    // =====================================================
    document
      .getElementById(
        "usernameInput"
      )
      .addEventListener(
        "keydown",
        function(event) {
          if (
            event.key ===
            "Enter"
          ) {
            event.preventDefault();
            enterContainer();
          }
        }
      );
    </script> </body> </html>
